[project]
name = "ai-log-triage-lab"
version = "0.2.0"
description = "Synthetic log triage lab with structured output and future LLM integration."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
